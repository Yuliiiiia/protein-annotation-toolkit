<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Protein Structure Viewer{% endblock %}</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel-border: #26304a;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --accent: #5b8def;
    --accent-dim: #3a5a99;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 600;
  }
  header .tagline {
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .flash {
    background: #3a1e1e;
    border: 1px solid #6b3030;
    color: #f0b8b8;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
  }
  input[type=text] {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 1rem;
    width: 100%;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.6rem 1.4rem;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dim); }
  label { font-size: 0.9rem; color: var(--text-dim); }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--text-dim); font-weight: 500; }
  code { font-family: var(--mono); background: var(--bg); padding: 0.1rem 0.35rem; border-radius: 4px; }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin-top: 0; }
  #viewer {
    width: 100%;
    height: 480px;
    border-radius: 10px;
    background: #05070c;
    position: relative;   /* 3Dmol.js's canvas positions itself relative to
                              this container -- without this, the canvas can
                              escape its box and overlap the rest of the page */
    overflow: hidden;
  }
  .pill {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 0.15rem 0.7rem;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-right: 0.4rem;
  }
</style>
</head>
<body>
<header>
  <h1>Protein Structure Viewer</h1>
  <span class="tagline">fetch → analyze → visualize, one PDB ID at a time</span>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
